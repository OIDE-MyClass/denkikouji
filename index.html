<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第2種電気工事士 技能補習日別スケジュール（下期版）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --secondary: #fbbf24;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border: #334155;
            --off-day: #1e1b4b;
            --saturday-bg: #0f3f5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 45px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text);
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .status-bar {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            margin-top: -30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid var(--border);
            position: relative;
            z-index: 10;
        }

        .status-item {
            text-align: center;
            min-width: 120px;
        }

        .status-val {
            display: block;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }

        .status-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-title {
            font-size: 1.5rem;
            font-weight: bold;
            border-left: 6px solid var(--secondary);
            padding-left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-phase0 { background-color: var(--secondary); }
        .dot-groupA { background-color: #38bdf8; }
        .dot-groupB { background-color: #ec4899; }
        .dot-groupC { background-color: #a855f7; }
        .dot-groupD { background-color: #eab308; }
        .dot-phase2 { background-color: #10b981; }
        .dot-phase3 { background-color: #f43f5e; }
        .dot-off { background-color: #64748b; }
        .dot-sat { background-color: #38bdf8; border: 1px solid #fbbf24;}

        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border-left: 6px solid var(--border);
            display: grid;
            grid-template-columns: 180px 1fr 120px;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border);
            border-left-width: 6px;
            transition: all 0.2s ease;
        }

        .day-card:hover {
            transform: translateX(5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .p-0 { border-left-color: var(--secondary); }
        .g-a { border-left-color: #38bdf8; }
        .g-b { border-left-color: #ec4899; }
        .g-c { border-left-color: #a855f7; }
        .g-d { border-left-color: #eab308; }
        .p-2 { border-left-color: #10b981; }
        .p-3 { border-left-color: #f43f5e; }
        .off { 
            border-left-color: #64748b; 
            background: var(--off-day);
            opacity: 0.75;
        }
        .sat-special {
            border-left-color: var(--secondary);
            background: var(--saturday-bg);
            border-width: 2px 2px 2px 8px;
            border-color: var(--secondary);
        }

        .day-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .day-date {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
        }

        .day-label {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .day-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .day-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-desc {
            font-size: 14px;
            color: var(--text-muted);
        }

        .day-action {
            display: flex;
            justify-content: flex-end;
        }

        .check-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            width: 100%;
            justify-content: center;
        }

        .check-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }

        .day-card.completed {
            opacity: 0.6;
            background: rgba(30, 41, 59, 0.3);
        }

        .day-card.completed .check-btn {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #0f172a;
        }

        .day-card.completed .day-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .off .check-btn { display: none; }
        .off-badge {
            background: #475569;
            color: #f1f5f9;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .day-card { grid-template-columns: 1fr; gap: 12px; }
            .day-action { justify-content: flex-start; width: 100%; }
            .status-bar { flex-direction: column; align-items: center; gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <h1><i class="fa-solid fa-calendar-days" style="color: var(--secondary);"></i> 技能補習日別ロードマップ（下期）</h1>
    <p>11/5開始〜12/11終了 ｜ 1周目1日1問 ＆ 11/28特別4問 ＆ 3周目1日2問完了</p>
</header>

<div class="container">
    <div class="status-bar">
        <div class="status-item">
            <span class="status-val" id="days-left">--日</span>
            <span class="status-label">補習完了まで</span>
        </div>
        <div class="status-item">
            <span class="status-val" id="completed-count">0 / 27</span>
            <span class="status-label">補習完了数</span>
        </div>
        <div class="status-item">
            <span class="status-val" id="progress-percent">0%</span>
            <span class="status-label">練習進捗率</span>
        </div>
    </div>

    <div class="controls">
        <div class="view-title">
            <i class="fa-solid fa-list-check"></i>
            トレーニングメニュー（11月5日〜12月11日）
        </div>
        <div class="legend">
            <div class="legend-item"><span class="dot dot-phase0"></span>複線図</div>
            <div class="legend-item"><span class="dot dot-groupA"></span>A:基本形</div>
            <div class="legend-item"><span class="dot dot-groupB"></span>B:スイッチ</div>
            <div class="legend-item"><span class="dot dot-groupC"></span>C:特殊盤</div>
            <div class="legend-item"><span class="dot dot-groupD"></span>D:配管</div>
            <div class="legend-item"><span class="dot dot-phase2"></span>2周目</div>
            <div class="legend-item"><span class="dot dot-phase3"></span>3周目</div>
            <div class="legend-item"><span class="dot dot-off"></span>休み（祝日）</div>
            <div class="legend-item"><span class="dot dot-sat"></span>土曜特訓</div>
        </div>
    </div>

    <div class="timeline-container" id="schedule-timeline"></div>
</div>

<script>
    const scheduleData = [
        // Phase 0: 複線図 3日間
        { date: "11/05", day: "木", phase: "p-0", label: "複線図集中", title: "複線図の基本＆No.1〜5", desc: "電線の接地側（極白）と非接地側（極黒）の接続ルールを徹底的に学習します。" },
        { date: "11/06", day: "金", phase: "p-0", label: "複線図集中", title: "3路・4路・パイロットランプ＆No.6〜10", desc: "複雑なスイッチ回路を整理。配線色を決定する共通ルールを固定します。" },
        { date: "11/09", day: "月", phase: "p-0", label: "複線図集中", title: "全13問タイムトライアル(3分目標)", desc: "問題を見た瞬間に、迷わず正確に複線図が完成できる状態に引き上げます。" },
        
        // 1周目: グループ別・1日1問（11/10〜11/26）
        { date: "11/10", day: "火", phase: "g-a", label: "1周目:No.1", title: "公表問題 No.1 (基本回路)", desc: "基本のVVFストリップおよびランプレセプタクルの輪作り。寸法計算の理解。" },
        { date: "11/11", day: "水", phase: "g-a", label: "1周目:No.2", title: "公表問題 No.2 (常時点灯PL)", desc: "パイロットランプ常時点灯の結線ルール。メタルラス壁防護の施工。" },
        { date: "11/12", day: "木", phase: "g-c", label: "1周目:No.3", title: "公表問題 No.3 (タイムスイッチ)", desc: "端子台をタイムスイッチに見立てた回路。基本配線の端子台差込とネジ締めの精度重視。" },
        { date: "11/13", day: "金", phase: "g-a", label: "1周目:No.5", title: "公表問題 No.5 (20A接地極付)", desc: "125V・20A接地極付コンセント。太い接続刃の締め付け固定、コンセントの極性確認。" },
        { date: "11/16", day: "月", phase: "g-a", label: "1周目:No.9", title: "公表問題 No.9 (EETコンセント)", desc: "接地端子付コンセント(EET)への接続。渡り線の整理方法と結線ルールの定着。" },
        { date: "11/17", day: "火", phase: "g-a", label: "1周目:No.10", title: "公表問題 No.10 (同時点滅PL)", desc: "同時点滅回路は結線の最難関。落ち着いて確実に施工。器具の接続順番を確認します。" },
        { date: "11/18", day: "水", phase: "g-b", label: "1周目:No.6", title: "公表問題 No.6 (3路スイッチ)", desc: "3路スイッチ(0番端子)の配線ルール。共通線に使用する色に厳格なルールを定めます。" },
        { date: "11/19", day: "木", phase: "g-b", label: "1周目:No.7", title: "公表問題 No.7 (4路スイッチ)", desc: "3路の間に割り込む4路スイッチの複雑配線。複線図通りの色の組み合わせを意識します。" },
        { date: "11/20", day: "金", phase: "g-c", label: "1周目:No.4", title: "公表問題 No.4 (動力3相3線)", desc: "ブレーカーおよび端子台結線。太い電線の扱い、配線の極性とネジ締めトルクを確認。" },
        
        // 祝日お休み
        { date: "11/23", day: "月", phase: "off", label: "補習なし", title: "【祝日】勤労感謝の日でお休み", desc: "本日は祝日のため補習はお休みです。自宅で複線図の復習を。" },
        
        { date: "11/24", day: "火", phase: "g-c", label: "1周目:No.8", title: "公表問題 No.8 (リモコンリレー)", desc: "端子台代用のリモコンリレー回路。渡り線の寸法出しを整理し、器具の裏配線を習得。" },
        { date: "11/25", day: "水", phase: "g-c", label: "1周目:No.13", title: "公表問題 No.13 (自動点滅器)", desc: "自動点滅器端子台への結線。施工条件に沿った電線色の固定。1日1問での解説最終日。" },
        { date: "11/26", day: "木", phase: "g-d", label: "1周目:No.11-12", title: "公表問題 No.11 ＆ No.12 (配管工事)", desc: "金属管施工(ねじなし管)とPF管のボックス接続。1周目のラストを飾る2つの大道具を処理。1周目全13問完了！" },

        // 2周目: スピードアップ（11/27〜12/03）
        { date: "11/27", day: "金", phase: "p-2", label: "2周目:スピード", title: "公表問題 No.1 ＆ No.2 (各40分制限)", desc: "ここからタイム測定を開始。器具・電線加工の手順を無駄なく組み換え。" },
        { date: "11/28", day: "土", phase: "sat-special", label: "土曜特別補習", title: "公表問題 No.5 ＆ No.6 ＆ No.7 ＆ No.8", desc: "【特別集中訓練】コンセント基本、3路、4路、リモコンリレーを一気に復習。施工手順の自動化（ノータイム結線）を確立させます。" },
        { date: "11/30", day: "月", phase: "p-2", label: "2周目:スピード", title: "公表問題 No.3 ＆ No.4 (各40分制限)", desc: "スピードと同時に「欠陥基準（芯線のはみ出し、ネジゆるみ）」を厳しく自己確認。" },
        { date: "12/01", day: "火", phase: "p-2", label: "2周目:スピード", title: "公表問題 No.9 ＆ No.10 (各40分制限)", desc: "同時点滅とEETコンセント。焦らず複雑な配線を素早く正確にまとめ上げます。" },
        { date: "12/02", day: "水", phase: "p-2", label: "2周目:スピード", title: "公表問題 No.11 ＆ No.12 (各40分制限)", desc: "金属管・PF管の接続を焦らず正確に。力任せではなく正しい工具の使い方で。" },
        { date: "12/03", day: "木", phase: "p-2", label: "2周目完了", title: "公表問題 No.13 (40分制限)", desc: "2周目最後の1問。タイムを計測し、3周目の模擬試験モードに入る最終仕上がりを確認。" },

        // 3周目: 模擬試験（12/04〜12/11）
        { date: "12/04", day: "金", phase: "p-3", label: "3周目:模擬戦", title: "模擬試験 No.1 ＆ No.2 (各30分制限)", desc: "3周目模擬試験スタート。制限時間40分に対し、10分の余りを作って見直しを徹底。" },
        { date: "12/07", day: "月", phase: "p-3", label: "3周目:模擬戦", title: "模擬試験 No.3 ＆ No.4 (各30分制限)", desc: "本番と同様の材料支給からスタート。30分以内で施工し、余った時間を完全に見直しに充てます。" },
        { date: "12/08", day: "火", phase: "p-3", label: "3周目:模擬戦", title: "模擬試験 No.5 ＆ No.6 (各30分制限)", desc: "動力遮断器への結線、接地極の極性。施工条件の特殊指定（色変更など）を完璧に見抜きます。" },
        { date: "12/09", day: "水", phase: "p-3", label: "3周目:模擬戦", title: "模擬試験 No.7 ＆ No.8 (各30分制限)", desc: "3路・4路スイッチ回路の高速施工。整線（配線を綺麗に整える）の美しさも追求します。" },
        { date: "12/10", day: "木", phase: "p-3", label: "3周目:模擬戦", title: "模擬試験 No.9 ＆ No.10 (各30分制限)", desc: "リモコンリレー・EETコンセント。手際よく器具取付と接続を完了させます。" },
        { date: "12/11", day: "金", phase: "p-3", label: "3周目完了", title: "模擬試験 No.11, No.12, No.13 (各30分制限)", desc: "【大目標達成】本日で3周目全13問の走破完了！全問30分切り達成で補習完走。本番もこの調子で！" }
    ];

    const targetDate = new Date("2026-12-11");

    function updateCountdown() {
        const today = new Date("2026-11-05");
        const diffTime = targetDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById("days-left").innerText = diffDays + "日";
    }

    function generateTimeline() {
        const container = document.getElementById("schedule-timeline");
        container.innerHTML = "";
        const completedTasks = JSON.parse(localStorage.getItem("completedTasks_second") || "[]");

        scheduleData.forEach((item, index) => {
            const isCompleted = completedTasks.includes(index);
            const isOff = item.phase === "off";
            const card = document.createElement("div");
            card.className = `day-card ${item.phase} ${isCompleted ? 'completed' : ''}`;
            card.dataset.index = index;

            let actionArea = `
                <button class="check-btn" onclick="toggleTask(${index})">
                    <i class="fa-solid ${isCompleted ? 'fa-circle-check' : 'fa-circle'}"></i>
                    <span>${isCompleted ? '完了' : '未完了'}</span>
                </button>
            `;

            if (isOff) {
                actionArea = `<div class="off-badge">祝日休み</div>`;
            }

            card.innerHTML = `
                <div class="day-meta">
                    <span class="day-date">${item.date} (${item.day})</span>
                    <span class="day-label">${item.label}</span>
                </div>
                <div class="day-content">
                    <div class="day-title">${item.title}</div>
                    <div class="day-desc">${item.desc}</div>
                </div>
                <div class="day-action">
                    ${actionArea}
                </div>
            `;
            container.appendChild(card);
        });

        updateProgress();
    }

    function updateProgress() {
        const completedTasks = JSON.parse(localStorage.getItem("completedTasks_second") || "[]");
        const activeTasks = scheduleData.filter(item => item.phase !== "off");
        const totalActive = activeTasks.length; 
        
        let completedActiveCount = 0;
        completedTasks.forEach(index => {
            if (scheduleData[index] && scheduleData[index].phase !== "off") {
                completedActiveCount++;
            }
        });

        const percent = Math.round((completedActiveCount / totalActive) * 100);

        document.getElementById("completed-count").innerText = `${completedActiveCount} / ${totalActive}`;
        document.getElementById("progress-percent").innerText = `${percent}%`;
    }

    window.toggleTask = function(index) {
        let completedTasks = JSON.parse(localStorage.getItem("completedTasks_second") || "[]");
        
        if (completedTasks.includes(index)) {
            completedTasks = completedTasks.filter(item => item !== index);
        } else {
            completedTasks.push(index);
        }

        localStorage.setItem("completedTasks_second", JSON.stringify(completedTasks));
        generateTimeline();
    }

    window.onload = function() {
        updateCountdown();
        generateTimeline();
    }
</script>

</body>
</html>
